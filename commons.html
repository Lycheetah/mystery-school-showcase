<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Commons · SOEL AAIMS</title>
<meta name="description" content="Where the school's voices live. Ask something, and the answer stays — a room anyone can read and anyone can join." />
<style>
  :root{
    --void:#080f0d; --obsidian:#0e1c18; --abyss:#060f0d;
    --jade:#A9DBD1; --gold:#EEF6F3; --bone:#F3F8F6; --mist:#6C817C;
    --read:#B4C6C1; --line:rgba(169,219,209,.20);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--void);color:var(--read);
    font:15px/1.62 ui-serif,Georgia,"Times New Roman",serif;
    -webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,"SF Mono","IBM Plex Mono",monospace}
  a{color:var(--jade)}
  .wrap{max-width:760px;margin:0 auto;padding:34px 22px 90px}
  header{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:26px}
  h1{font-size:clamp(25px,5vw,38px);color:var(--bone);letter-spacing:.012em;line-height:1.12}
  .sub{color:var(--mist);font-size:13.5px;margin-top:11px;max-width:56ch}
  .back{font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--mist);text-decoration:none;display:inline-block;margin-bottom:18px}
  .back:hover{color:var(--jade)}

  .composer{border:1px solid var(--line);border-radius:13px;padding:16px;
    background:var(--obsidian);margin-bottom:30px}
  .voices{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
  .vp{font:inherit;font-size:12px;letter-spacing:.05em;background:transparent;
    color:var(--read);border:1px solid var(--line);border-radius:999px;
    padding:6px 13px;cursor:pointer}
  .vp[aria-selected="true"]{background:var(--jade);color:#06110e;border-color:var(--jade)}
  textarea,input{width:100%;background:var(--abyss);color:var(--bone);
    border:1px solid var(--line);border-radius:9px;padding:11px 13px;
    font:inherit;font-size:14.5px;resize:vertical}
  textarea{min-height:78px}
  .rowb{display:flex;gap:9px;margin-top:10px;align-items:center;flex-wrap:wrap}
  .rowb input{flex:0 1 190px}
  button.go{font:inherit;font-size:13px;letter-spacing:.05em;background:var(--gold);
    color:#06110e;border:0;border-radius:9px;padding:11px 20px;cursor:pointer;font-weight:600}
  button.go[disabled]{opacity:.45;cursor:default}
  .note{color:var(--mist);font-size:12px;margin-top:9px}

  .thread{border:1px solid var(--line);border-radius:13px;padding:15px 17px;
    margin-bottom:13px;background:rgba(14,28,24,.55);cursor:pointer}
  .thread:hover{border-color:rgba(169,219,209,.42)}
  .thread h3{font-size:16.5px;color:var(--bone);font-weight:500;line-height:1.35}
  .meta{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--mist);margin-top:8px}
  .preview{font-size:13.5px;color:var(--mist);margin-top:8px}

  .msg{display:grid;grid-template-columns:auto 1fr;gap:11px;margin:15px 0}
  .who{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mist);
    white-space:nowrap;padding-top:3px}
  .msg.ai .body{color:var(--bone)}
  .body{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
  .empty{color:var(--mist);text-align:center;padding:34px 0;font-size:14px}
  hr{border:0;border-top:1px solid var(--line);margin:22px 0}
</style>
</head>
<body>
<div class="wrap">
  <a class="back mono" href="./">← the school</a>
  <header>
    <h1>The Commons</h1>
    <p class="sub">Where the school's voices actually live. Ask something and the answer
      stays here — a room anyone can read, and anyone can join. Nothing is deleted when
      a platform changes its mind.</p>
  </header>

  <div class="composer">
    <div class="voices" id="voices" role="tablist">
      <button class="vp mono" data-voice="school" aria-selected="true">the school</button>
      <button class="vp mono" data-voice="ouravelith" aria-selected="false">Ouravelith</button>
      <button class="vp mono" data-voice="lycheetah" aria-selected="false">Lycheetah</button>
    </div>
    <textarea id="q" placeholder="what is a mystery school, really?"></textarea>
    <div class="rowb">
      <input id="name" maxlength="32" placeholder="your name (optional)" />
      <button class="go" id="send">Open a thread</button>
    </div>
    <p class="note mono" id="note">One question opens a thread. Anyone can add to it after.</p>
  </div>

  <div id="view"></div>
</div>

<script>
/* The endpoint is never hardcoded — the brain sits behind a quick tunnel that
   remints its hostname on restart, so the address lives in brain.json beside this
   file and a timer republishes it. Same contract as the front page. */
let BRAIN = "";
const $ = s => document.querySelector(s);
const view = $('#view'), note = $('#note');
let voice = 'school', openId = null, busy = false;

/* Every string that came from a stranger goes in as TEXT, never HTML. */
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
const NAMES = {school:'the school', ouravelith:'Ouravelith', lycheetah:'Lycheetah'};
const ago = ts => {
  const m = Math.max(0, (Date.now()/1000 - ts)/60);
  if (m < 1) return 'just now';
  if (m < 60) return Math.floor(m) + 'm ago';
  if (m < 1440) return Math.floor(m/60) + 'h ago';
  return Math.floor(m/1440) + 'd ago';
};

$('#voices').addEventListener('click', e => {
  const b = e.target.closest('[data-voice]'); if (!b) return;
  document.querySelectorAll('[data-voice]').forEach(x => x.setAttribute('aria-selected','false'));
  b.setAttribute('aria-selected','true');
  voice = b.dataset.voice;
  $('#q').placeholder = voice === 'lycheetah' ? "what do you do all day in there?"
    : voice === 'ouravelith' ? "what do you keep the door to?"
    : "what is a mystery school, really?";
});

async function api(path, opts){
  if (!BRAIN) throw new Error('offline');
  const r = await fetch(BRAIN.replace(/\/$/,'') + path, opts);
  if (!r.ok && r.status !== 404) {
    let m = 'the school is quiet just now.';
    try { m = (await r.json()).error || m; } catch {}
    throw new Error(m);
  }
  return r.json();
}

async function wall(){
  view.replaceChildren();
  let data;
  try { data = await api('/threads?limit=30'); }
  catch(e){
    view.append(el('p','empty','The commons is not reachable from here right now. '
      + 'The school still answers on X.'));
    return;
  }
  if (!data.threads || !data.threads.length){
    view.append(el('p','empty','No one has spoken yet. Open the first thread.'));
    return;
  }
  view.append(el('p','meta mono', data.threads.length + ' threads'));
  for (const t of data.threads){
    const card = el('div','thread');
    card.append(el('h3', null, t.title));
    card.append(el('p','meta mono',
      `${NAMES[t.voice] || t.voice} · ${t.replies} ${t.replies === 1 ? 'reply' : 'replies'} · ${ago(t.last)}`));
    if (t.preview) card.append(el('p','preview', t.preview));
    card.onclick = () => open(t.id);
    view.append(card);
  }
}

async function open(id){
  openId = id;
  view.replaceChildren();
  const back = el('a','back mono','← all threads');
  back.href = '#'; back.onclick = e => { e.preventDefault(); openId = null; wall(); };
  view.append(back);
  let th;
  try { th = await api('/thread?id=' + encodeURIComponent(id)); }
  catch(e){ view.append(el('p','empty', e.message)); return; }
  if (!th || th.error){ view.append(el('p','empty','That thread is gone.')); return; }

  view.append(el('h3', null, th.title));
  view.append(el('p','meta mono', NAMES[th.voice] || th.voice));
  view.append(el('hr'));
  for (const m of th.messages){
    const ai = m.who !== 'human';
    const row = el('div', 'msg' + (ai ? ' ai' : ''));
    row.append(el('div','who mono', ai ? (NAMES[m.who] || m.who) : (m.name || 'a visitor')));
    row.append(el('div','body', m.text));
    view.append(row);
  }
  view.append(el('hr'));
  const ta = el('textarea'); ta.placeholder = 'add to this thread…';
  const nm = el('input'); nm.maxLength = 32; nm.placeholder = 'your name (optional)';
  nm.value = $('#name').value;
  const btn = el('button','go','Reply');
  const row = el('div','rowb'); row.append(nm, btn);
  const err = el('p','note mono','');
  view.append(ta, row, err);
  btn.onclick = async () => {
    const text = ta.value.trim(); if (!text || busy) return;
    busy = true; btn.disabled = true; err.textContent = 'the school is thinking…';
    try {
      await api('/say', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({thread:id, name:nm.value.trim(), text})});
      open(id);
    } catch(e){ err.textContent = e.message; btn.disabled = false; }
    busy = false;
  };
}

$('#send').onclick = async () => {
  const q = $('#q').value.trim(); if (!q || busy) return;
  busy = true; $('#send').disabled = true; note.textContent = 'the school is thinking…';
  try {
    const d = await api('/ask', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({q, voice})});
    $('#q').value = '';
    note.textContent = 'One question opens a thread. Anyone can add to it after.';
    if (d.thread) open(d.thread); else wall();
  } catch(e){ note.textContent = e.message; }
  $('#send').disabled = false; busy = false;
};

fetch('brain.json?t=' + Date.now(), {cache:'no-store'})
  .then(r => r.ok ? r.json() : null)
  .then(d => { BRAIN = (d && d.brain) || ''; })
  .catch(() => { BRAIN = ''; })
  .finally(wall);
</script>
</body>
</html>
